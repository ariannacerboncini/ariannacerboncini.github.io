name: Generate Calendars & Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download del repository (fetch-depth: 0 permette a paths-filter di confrontare i commit)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Controlla quali file sono cambiati
      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            calendars:
              - 'calendar-mujeres/src/data/**'
              - 'calendar-mujeres/src/scripts/**'

      # 3. Set up Python solo se sono cambiati i file del calendario o se è un'esecuzione manuale
      - name: Set up Python
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Installazione dipendenze Python
      - name: Install Python dependencies
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          if [ -f calendar-mujeres/requirements.txt ]; then
            pip install -r calendar-mujeres/requirements.txt
          else
            pip install icalendar
          fi

      # 5. Generazione degli ICS
      - name: Generate calendars
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./calendar-mujeres
        run: |
          python src/scripts/generate-ics.py

      # 6. Setup Node.js (sempre attivo ad ogni commit)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'calendar-mujeres/package-lock.json'

      # 7. Build dell'app React (include i file .ics se salvati in public/)
      - name: Install Node dependencies and Build
        working-directory: ./calendar-mujeres
        run: |
          npm ci
          npm run build

      # 8. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 9. Upload
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './calendar-mujeres/dist'

      # 10. Deploy su GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
