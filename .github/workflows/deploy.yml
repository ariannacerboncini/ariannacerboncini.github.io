name: Generate Calendars & Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write    # PERMESSO DI SCRITTURA NECESSARIO PER IL GIT PUSH
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download del repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Controlla quali file sono cambiati
      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            calendars:
              - 'calendar-mujeres/src/data/**'
              - 'calendar-mujeres/src/scripts/**'

      # 3. Set up Python
      - name: Set up Python
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Installazione dipendenze Python
      - name: Install Python dependencies
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          if [ -f calendar-mujeres/requirements.txt ]; then
            pip install -r calendar-mujeres/requirements.txt
          else
            pip install icalendar
          fi

      # 5. Generazione degli ICS
      - name: Generate calendars
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./calendar-mujeres
        run: |
          python src/scripts/generate-ics.py

      # 6. Commit e push ICS (eseguito solo se gli ICS sono stati rigenerati)
      - name: Commit and push generated .ics files
        if: steps.changes.outputs.calendars == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar-mujeres/public/calendars/*.ics calendars/*.ics 2>/dev/null || true
          git add .
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei file .ics da committare."
          else
            git commit -m "chore: update generated .ics calendar files [skip ci]"
            git push
          fi

      # 7. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'calendar-mujeres/package-lock.json'

      # 8. Build dell'app React
      - name: Install Node dependencies and Build
        working-directory: ./calendar-mujeres
        run: |
          npm ci
          npm run build

      # 9. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 10. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './calendar-mujeres/dist'

      # 11. Deploy su GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
