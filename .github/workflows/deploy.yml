name: Generate Calendar & Deploy to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'calendar-mujeres/src/data/partite.json'
      - 'calendar-mujeres/src/scripts/generate-ics.py'
      - '.github/workflows/deploy.yml'

  # Permette di lanciare la pipeline manualmente da GitHub se necessario
  workflow_dispatch:

# Permessi necessari sia per salvare il commit del file .ics sia per pubblicare su GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download del repository
      - name: Checkout repository
        uses: actions/checkout@v4

     # 2. Set up dell'ambiente Python (senza il controllo di cache obbligatorio)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installazione dipendenze Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f calendar-mujeres/requirements.txt ]; then 
            pip install -r calendar-mujeres/requirements.txt
          else 
            pip install icalendar
          fi

      # 4. Esecuzione dello script Python per rigenerare l'ICS
      - name: Run Python script to generate ICS
        working-directory: ./calendar-mujeres
        run: |          
          python src/scripts/generate-ics.py

      # 5. Commit e Push del file .ics aggiornato (con [skip ci] per evitare loop)
      - name: Commit and push updated ICS file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update mujeres_calendar.ics [skip ci]"
          file_pattern: "calendar-mujeres/public/mujeres_calendar.ics"

      # 6. Setup di Node.js per buildare l'app Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'calendar-mujeres/package-lock.json'

      # 7. Installazione dipendenze Node e Build dell'app
      - name: Install Node dependencies and Build
        working-directory: ./calendar-mujeres
        run: |
          npm ci
          npm run build

      # 8. Deploy della cartella dist su GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './calendar-mujeres/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
